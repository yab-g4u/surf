[project]
name = "surf-search-engine"
version = "0.1.0"
description = "Local-first hybrid search engine for developer internet sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "sqlite-vec>=0.1.6",
  "sentence-transformers>=3.0.1",
  "apscheduler>=3.10.4",
  "typer>=0.16.0",
  "httpx>=0.28.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
  "mypy>=1.11.2"
]

[project.scripts]
surf = "scripts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
